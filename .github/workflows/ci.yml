name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Native metadata authority model
        run: python3 scripts/formal/check_native_head.py --self-test --output target/native-head-model.json
      - name: Native COW content-resolution model
        run: python3 scripts/formal/check_native_cow.py --self-test --output target/native-cow-model.json
      - name: Native namespace election model
        run: python3 scripts/formal/check_native_provision.py --self-test --output target/native-provision-model.json
      - name: Native coupled semantic model
        run: python3 scripts/formal/check_native_semantic.py --self-test --output target/native-semantic-model.json
      - name: Package (dry-run)
        run: cargo publish --dry-run

  # Eight counterbalanced end-to-end Local comparisons; unchanged paired ratio floors.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-perf
      - name: Release perf_throughput (honest floor)
        run: cargo test --release --test perf_throughput honest -- --nocapture --test-threads=1
        env:
          # Keep CI time bounded; ratio gate is what matters, not absolute MiB/s.
          OBJECT_LOG_PERF_BYTES: "67108864"

  # Live S3 transport and native authority against a checksum-pinned RustFS.
  s3-rustfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: S3 and native provider qualification (RustFS)
        run: python3 scripts/ci/native_s3.py --self-test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Doc (deny warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain (1.99.0)
        uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (licenses + advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

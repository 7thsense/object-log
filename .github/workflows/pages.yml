name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
          extended: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website deps
        working-directory: website
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Hugo build
        working-directory: website
        run: hugo --gc --minify
        env:
          HUGO_ENVIRONMENT: production

      - name: Playwright e2e (screenshots + dead links)
        working-directory: website
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            website/playwright-report
            website/test-results
          retention-days: 7

      # Belt-and-suspenders: Playwright starts `hugo server` for e2e. Hugo 0.159+
      # writes to disk by default and can clobber public/ with a 127.0.0.1
      # livereload build. Rebuild production output right before upload.
      - name: Rebuild production site for deploy
        if: github.event_name != 'pull_request'
        working-directory: website
        run: rm -rf public resources && hugo --gc --minify
        env:
          HUGO_ENVIRONMENT: production

      - name: Assert production artifact (no livereload / localhost)
        if: github.event_name != 'pull_request'
        working-directory: website
        run: |
          set -euo pipefail
          test -f public/index.html
          if grep -E 'livereload|127\.0\.0\.1' public/index.html; then
            echo "::error::Production public/ still contains livereload or 127.0.0.1"
            exit 1
          fi
          grep -q 'Many writes' public/index.html
          grep -q 'olog-btn-primary' public/index.html
          ls public/css/compiled/main.min.*.css | head -1
          grep -q 'olog-btn-primary' public/css/compiled/main.min.*.css
          grep -q -- '--olog-copper' public/css/compiled/main.min.*.css

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

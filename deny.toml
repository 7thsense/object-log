# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on any security advisory or unmaintained/yanked crate.
# RUSTSEC-2026-0441 is an informational unmaintained advisory for pin-utils,
# which the AWS SDK still uses transitively. object-log does not use it
# directly. Version 0.1.1 is the final upstream release; there is no maintained
# compatible replacement until the SDK moves to core::pin or pin-project-lite.
# Retain this narrowly identified maintenance exception while keeping actual
# vulnerability and yanked-release checks enabled. Review on each SDK update.
ignore = ["RUSTSEC-2026-0441"]

[licenses]
version = 2
# object-log is dual MIT OR Apache-2.0; only permissive licenses are allowed in
# the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

# Mozilla certificate data bundled by the explicit owned TLS trust store.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Allow multiple versions (transitive duplicates are common); flag nothing here
# by default. Tighten if dependency bloat becomes a concern.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

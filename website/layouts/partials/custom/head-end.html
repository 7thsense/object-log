<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@500;600;700;800&display=swap"
  rel="stylesheet"
/>
<meta name="theme-color" content="#0A0F1A" />
{{/* Force dark theme before first paint so the brand skin is not a light flash. */}}
<script>
  try {
    document.documentElement.classList.add('dark')
    document.documentElement.style.colorScheme = 'dark'
    localStorage.setItem('theme', 'dark')
  } catch (_) {}
</script>
